name: Python API and React CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: golfdb_test
          POSTGRES_USER: golfdb
          POSTGRES_PASSWORD: golfdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golfdb -d golfdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://golfdb:golfdb_test@localhost:5432/golfdb_test
      PYTHONPATH: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f backend/requirements.txt ]]; then
            python -m pip install -r backend/requirements.txt
          elif [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          elif [[ -f backend/pyproject.toml ]]; then
            python -m pip install ./backend
          elif [[ -f pyproject.toml ]]; then
            python -m pip install .
          else
            echo "No Python dependency manifest found; skipping dependency installation."
          fi
          if [[ -f backend/requirements-dev.txt ]]; then
            python -m pip install -r backend/requirements-dev.txt
          elif [[ -f requirements-dev.txt ]]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Compile Python sources
        run: python -m compileall -q backend Dev-Actions-Workflows

      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d backend/tests ]]; then
            python -m pip install pytest
            python -m pytest backend/tests
          elif [[ -d tests ]]; then
            python -m pip install pytest
            python -m pytest
          else
            echo "No Python tests directory found; skipping pytest."
          fi

      - name: Set up Node.js
        if: ${{ hashFiles('frontend/package-lock.json', 'package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Install React dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci

      - name: Build React app
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm run build
