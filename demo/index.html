<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GolfDB+ · Interactive Demo</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial;background:#0a101b;color:#eaf0fa;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:#7fc5ff}.app{display:flex;min-height:100vh}.sidebar{width:244px;background:#101b2a;border-right:1px solid #25364b;padding:22px 14px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;padding:6px 12px 22px}.brand b{color:#5fdaa4}.brand span{background:#1b5d47;padding:6px;border-radius:8px;font-size:15px;color:#8bf0c2}.nav-heading{font-size:10px;letter-spacing:1.8px;color:#8196ae;font-weight:750;margin:22px 12px 9px}.nav-btn{display:block;width:100%;text-align:left;color:#a9bdd0;border:0;background:none;padding:12px 13px;border-radius:8px;margin:2px 0}.nav-btn.active,.nav-btn:hover{background:#1d3045;color:#fff}.sidefoot{font-size:11px;color:#8ea2b6;line-height:1.5;padding:20px 12px}.main{flex:1;min-width:0}.top{border-bottom:1px solid #243448;padding:20px 30px;display:flex;justify-content:space-between;gap:12px;align-items:center}.eyebrow{font-size:11px;color:#66d9aa;text-transform:uppercase;letter-spacing:2px;font-weight:bold}.top h1{margin:5px 0;font-size:25px}.pill{display:inline-block;border:1px solid #416650;background:#15382c;color:#8bf0b8;padding:7px 11px;border-radius:25px;font-size:11px}.content{padding:26px 30px;max-width:1480px}.muted{color:#8ba0b8}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.card,.panel{background:#111d2d;border:1px solid #293b50;border-radius:13px;padding:19px}.card small{color:#95a8bd;font-size:12px}.card strong{font-size:30px;display:block;margin:8px 0 4px}.card em{color:#69dba4;font-style:normal;font-size:11px}.panel{margin-bottom:18px}.panel h2{margin:0 0 18px;font-size:16px}.twocol{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{background:#0b1421;color:#e9f2ff;border:1px solid #34495e;border-radius:8px;padding:10px;min-width:130px}input{flex:1}.btn{background:#24684f;color:white;border:1px solid #328063;padding:10px 14px;border-radius:8px}.btn:focus-visible,.nav-btn:focus-visible{outline:2px solid #83dcff}.tag{color:#77c8ac;background:#173a32;padding:4px 7px;border-radius:5px;font-size:11px}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#97abc2;background:#16263a}td,th{padding:13px 11px;border-bottom:1px solid #243549}td{font-size:12px}.tablewrap{overflow:auto}.right{text-align:right}.barrow{display:grid;grid-template-columns:125px 1fr 40px;align-items:center;gap:12px;margin:16px 0}.track{background:#2a374b;height:9px;border-radius:12px;overflow:hidden}.fill{background:linear-gradient(90deg,#2e8f83,#70ddb1);height:100%;border-radius:12px}.chart{display:flex;align-items:end;gap:9px;height:170px;padding:12px 0 28px;border-bottom:1px solid #34475e}.col{flex:1;position:relative;border-radius:5px 5px 0 0;background:linear-gradient(#55d9ab,#257a7d);min-height:4px}.col span{position:absolute;bottom:-23px;left:0;width:100%;font-size:10px;color:#8399b1;text-align:center}.empty{text-align:center;color:#94a9be;padding:35px}.notice{border:1px solid #4a5133;background:#28291d;border-radius:8px;padding:12px;color:#e0ce8e;font-size:12px}.onlydemo{color:#8295ac;font-size:11px;margin-top:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.breadcrumb{font-size:12px;color:#829bb4}.fieldmap{background:linear-gradient(125deg,#183a35,#2e5a43);height:215px;border-radius:12px;position:relative;overflow:hidden;border:5px solid #1a3431}.fairway{position:absolute;left:22%;width:55%;top:-15%;height:135%;transform:rotate(18deg);border-radius:50%;background:#477c53}.green{position:absolute;left:40%;top:7%;width:35%;height:25%;border-radius:60%;background:#87aa65}.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#ecf3b0;border:1px solid #fff;box-shadow:0 0 8px #fff6}.small{font-size:12px}@media(max-width:900px){.sidebar{width:180px}.cards{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}@media(max-width:600px){.app{display:block}.sidebar{width:100%;border-right:0;border-bottom:1px solid #29394c;padding:10px}.brand{padding:4px;font-size:19px}.nav-heading,.sidefoot{display:none}.sidebar nav{display:flex;overflow:auto;gap:3px}.nav-btn{white-space:nowrap;width:auto;padding:9px}.top,.content{padding:18px}.top h1{font-size:20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card strong{font-size:24px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span>G+</span>GolfDB<b>+</b></div><div class="nav-heading">WORKSPACE</div><nav id="nav"></nav><div class="sidefoot">GolfDB+ v1.0<br>Interactive UI demonstration<br>Sample data only — not connected to live sources.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">GOLF INTELLIGENCE PLATFORM</div><h1 id="pageTitle">Data Entry</h1><div class="breadcrumb" id="subtitle">Players · Events · Courses</div></div><span class="pill">● DEMO MODE</span></header><div class="content" id="content"></div></main></div>
<script>
const players=[{id:'GDB-P-0001',name:'A. Morgan',nation:'USA',tour:'PGA',power:91,accuracy:72,approach:82,putting:76,sg:1.48},{id:'GDB-P-0002',name:'J. Park',nation:'KOR',tour:'PGA',power:75,accuracy:92,approach:86,putting:83,sg:1.72},{id:'GDB-P-0003',name:'M. Carter',nation:'ENG',tour:'DP',power:84,accuracy:81,approach:89,putting:70,sg:1.31},{id:'GDB-P-0004',name:'S. Rivera',nation:'ESP',tour:'LIV',power:95,accuracy:66,approach:73,putting:88,sg:1.11},{id:'GDB-P-0005',name:'L. Tan',nation:'SGP',tour:'ASIA',power:78,accuracy:87,approach:79,putting:85,sg:1.26}];
const events=[{id:'GDB-E-001',name:'Coastal Championship',season:'2026-PGA',tour:'PGA',course:'Harbor Golf Club',status:'Scheduled'},{id:'GDB-E-002',name:'Autumn Invitational',season:'2026-DP',tour:'DP',course:'Summit Links',status:'Complete'},{id:'GDB-E-003',name:'Desert Open',season:'2026-LIV',tour:'LIV',course:'Desert Pines',status:'Scheduled'}];
const courses=[{id:'GDB-C-001',name:'Harbor Golf Club',country:'USA',par:72,yards:7240,grass:'Bermuda'},{id:'GDB-C-002',name:'Summit Links',country:'ENG',par:71,yards:6980,grass:'Bentgrass'},{id:'GDB-C-003',name:'Desert Pines',country:'USA',par:72,yards:7502,grass:'Ryegrass'}];
let section='data',entity='players',focus=0,search='',tour='ALL';const $=id=>document.getElementById(id);
const safe=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function navigate(s){section=s;search='';tour='ALL';render()}
function choose(e){entity=e;search='';tour='ALL';render()}
function heading(){return section==='data'?'Data Entry':section==='stats'?'Stats & Metrics':'Models'}
function render(){ $('pageTitle').textContent=heading();$('subtitle').textContent=section==='data'?'Collection · Cleaning · Queries':section==='stats'?'Player performance · Scoring · Course analysis':'Features · Predictions · Model evaluation';
$('nav').innerHTML=[['data','◫  Data Entry'],['stats','▥  Stats & Metrics'],['models','◇  Models']].map(([s,t])=>'<button class="nav-btn '+(section===s?'active':'')+'" onclick="navigate(\''+s+'\')">'+t+'</button>').join('');
$('content').innerHTML=section==='data'?dataView():section==='stats'?statsView():modelsView();}
function kpis(items){return '<div class="cards">'+items.map(([label,val,note])=>'<div class="card"><small>'+label+'</small><strong>'+val+'</strong><em>'+note+'</em></div>').join('')+'</div>'}
function tabs(){return '<div class="filterbar">'+['players','events','courses'].map(x=>'<button class="btn" style="background:'+(entity===x?'#24684f':'#1b2c40')+';border-color:'+(entity===x?'#328063':'#30465c')+'" onclick="choose(\''+x+'\')">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div>'}
function dataView(){const ds=entity==='players'?players:entity==='events'?events:courses;const terms=Object.keys(ds[0]);const match=ds.filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase()))&&(tour==='ALL'||x.tour===tour));return '<p class="muted">Unified data registry with canonical GolfDB+ identifiers, external ID mapping and source validation.</p>'+kpis([['Player records',players.length,'Sample registry'],['Event records',events.length,'Sample registry'],['Course records',courses.length,'Sample registry'],['Source connections',0,'Not connected']])+ '<section class="panel">'+tabs()+'<div class="toolbar"><h2 style="margin:0">Master '+entity[0].toUpperCase()+entity.slice(1)+' Table</h2><span class="tag">DEMO DATA</span></div><div class="filterbar" style="margin-top:17px"><input aria-label="Search records" id="search" placeholder="Search ID, name, country or event…" value="'+safe(search)+'" oninput="search=this.value;updateRows()"><select aria-label="Tour filter" id="tourFilter" onchange="tour=this.value;updateRows()"><option value="ALL">All tours</option>'+['PGA','DP','LIV','SEN','ASIA'].map(x=>'<option '+(tour===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn" onclick="exportCsv()">Export filtered CSV</button></div><div class="tablewrap"><table><thead><tr>'+terms.map(x=>'<th>'+safe(x)+'</th>').join('')+'</tr></thead><tbody id="rows"></tbody></table></div><div class="onlydemo" id="rowcount"></div></section><div class="twocol"><section class="panel"><h2>Data Quality Pipeline</h2>'+['Source ID matching','Duplicate detection','Schema validation','Manual review queue'].map((x,i)=>'<div class="barrow"><span class="small">'+x+'</span><div class="track"><div class="fill" style="width:'+[92,78,88,50][i]+'%"></div></div><span class="small">'+[92,78,88,50][i]+'%</span></div>').join('')+'<div class="onlydemo">Illustrative workflow progress, not actual pipeline results.</div></section><section class="panel"><h2>Source Integrations</h2><div class="notice">PGA TOUR Media, ShotLink Reports and DataGolf are not connected in this demo. No official shot data has been imported.</div><p class="muted small">Source adapters, permissions, backfills, asset checksums and reconciliation remain implementation tasks.</p></section></div>'; }
function updateRows(){const ds=entity==='players'?players:entity==='events'?events:courses;const terms=Object.keys(ds[0]);const m=ds.filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase()))&&(tour==='ALL'||x.tour===tour));$('rows').innerHTML=m.map(x=>'<tr>'+terms.map(t=>'<td>'+safe(x[t])+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="'+terms.length+'" class="empty">No matching records</td></tr>';$('rowcount').textContent=m.length+' of '+ds.length+' example records displayed'}
function exportCsv(){let ds=entity==='players'?players:entity==='events'?events:courses;ds=ds.filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase()))&&(tour==='ALL'||x.tour===tour));if(!ds.length)return alert('No rows to export');let keys=Object.keys(ds[0]),quote=v=>'"'+String(v).replaceAll('"','""')+'"',csv=[keys.map(quote).join(','),...ds.map(row=>keys.map(k=>quote(row[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='golfdb-demo-'+entity+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function statsView(){let p=players[focus],metrics=[['Power',p.power],['Accuracy',p.accuracy],['Approach',p.approach],['Putting',p.putting]];return '<div class="toolbar"><p class="muted">Player skill distributions, scoring and shot-map workspace.</p><select aria-label="Player selection" onchange="focus=Number(this.value);render()">'+players.map((x,i)=>'<option value="'+i+'" '+(focus===i?'selected':'')+'>'+x.name+'</option>').join('')+'</select></div>'+kpis([['Strokes gained','+'+p.sg.toFixed(2),'Demo / round'],['Power rating',p.power+'/100','Demo scale'],['Accuracy',p.accuracy+'/100','Demo scale'],['Approach',p.approach+'/100','Demo scale']])+'<div class="twocol"><section class="panel"><h2>Player Skill Breakdown</h2>'+metrics.map(([k,v])=>'<div class="barrow"><span>'+k+'</span><div class="track"><div class="fill" style="width:'+v+'%"></div></div><b>'+v+'</b></div>').join('')+'<p class="onlydemo">Ratings are illustrative, not derived from PGA TOUR statistics.</p></section><section class="panel"><h2>Scoring Trend · Last 8 Rounds</h2><div class="chart">'+[68,72,70,69,66,71,67,69].map((v,i)=>'<div class="col" title="Score '+v+'" style="height:'+((76-v)*11+20)+'%"><span>R'+(i+1)+'</span></div>').join('')+'</div><div class="onlydemo">Example scoring series</div></section></div><section class="panel"><h2>Shot Dispersion · Fairway View</h2><div class="fieldmap"><div class="fairway"></div><div class="green"></div>'+Array.from({length:35},(_,i)=>'<span class="dot" style="left:'+(29+(i*17%44))+'%;top:'+(24+(i*23%58))+'%"></span>').join('')+'</div><p class="onlydemo">Illustrative coordinate scatter. Real Tourcast coordinate calibration is not implemented.</p></section>'}
function modelsView(){return '<p class="muted">Predictive modeling workbench for future player-course matching, scoring projections and shot outcome analysis.</p>'+kpis([['Model pipelines','3','Planned modules'],['Live models','0','Not deployed'],['Verified training data','0','Not loaded'],['Backtest runs','0','Not run']])+'<div class="twocol"><section class="panel"><h2>Model Roadmap</h2>'+[['Player–Course Fit','Feature engineering'],['Expected Round Score','Baseline regression'],['Shot Outcome Projection','Spatial modeling']].map(([x,y],i)=>'<div class="toolbar" style="border-bottom:1px solid #263649;padding:14px 0"><div><b>'+x+'</b><div class="muted small">'+y+'</div></div><span class="tag">PLANNED</span></div>').join('')+'</section><section class="panel"><h2>Model Governance</h2><div class="notice">No trained or live prediction model is connected. Scores should not be interpreted as real projections.</div><p class="muted small">Planned controls include time-aware feature snapshots, model versioning, calibration, confidence tracking and source citations.</p></section></div><section class="panel"><h2>Development Sequence</h2><div class="chart">'+[20,38,60,84,100].map((v,i)=>'<div class="col" style="height:'+v+'%"><span>'+['Ingest','Clean','Stats','Features','Model'][i]+'</span></div>').join('')+'</div><p class="onlydemo">Illustrative lifecycle illustration, not implementation progress.</p></section>'}
render();updateRows();
</script></body></html>
